const normalize = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function classify(description, customRules) {
  const norm = normalize(description);
  if (!norm) return null;
  const all = [...customRules, ...DEFAULT_RULES];
  for (const r of all) {
    if (norm.includes(normalize(r.kw))) return { type: r.type, category: r.category };
  }
  return null;
}

function detectRecurring(entries) {
  const groups = {};
  entries.filter((e) => e.type === "despesa" && e.description).forEach((e) => {
    const norm = normalize(e.description);
    const key = norm.split(" ").slice(0, 2).join(" ");
    if (!key) return;
    if (!groups[key]) groups[key] = { key, label: e.description, category: e.category, items: [] };
    groups[key].items.push(e);
  });
  const result = [];
  Object.values(groups).forEach((g) => {
    const months = new Set(g.items.map((i) => i.date.slice(0, 7)));
    if (months.size < 2) return;
    const values = g.items.map((i) => i.value);
    const min = Math.min(...values), max = Math.max(...values);
    if (min > 0 && max / min > 1.6) return;
    const avg = values.reduce((s, v) => s + v, 0) / values.length;
    const last = g.items.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
    result.push({ key: g.key, label: last.description || g.label, category: g.items[0].category, months: [...months].sort(), avgValue: avg, count: g.items.length });
  });
  return result.sort((a, b) => b.avgValue * b.months.length - a.avgValue * a.months.length);
}

function parseStatementText(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  if (lines.length === 0) return [];
  const firstLineIsHeader = /data|valor|desc|hist/i.test(lines[0]);
  const delim = lines[0].includes(";") ? ";" : lines[0].includes("\t") ? "\t" : ",";
  if (firstLineIsHeader && lines[0].split(delim).length >= 2) {
    const header = lines[0].split(delim).map((h) => h.trim().toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("data"));
    const descIdx = header.findIndex((h) => h.includes("desc") || h.includes("hist") || h.includes("estabelec"));
    const valueIdx = header.findIndex((h) => h.includes("valor") || h.includes("value"));
    if (dateIdx !== -1 && valueIdx !== -1) {
      return lines.slice(1).map((line) => {
        const cols = line.split(delim);
        return rowFromParts(cols[dateIdx], descIdx !== -1 ? cols[descIdx] : "", cols[valueIdx]);
      }).filter(Boolean);
    }
  }
  const lineRe = /(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.+?)\s+(-?R?\$?\s?-?\d[\d.,]*)\s*$/;
  const rows = [];
  for (const line of lines) {
    const m = line.match(lineRe);
    if (m) rows.push(rowFromParts(m[1], m[2], m[3]));
  }
  return rows.filter(Boolean);
}

function rowFromParts(rawDate, rawDesc, rawValue) {
  if (rawDate === undefined || rawValue === undefined) return null;
  let date = (rawDate || "").trim();
  const dm = date.match(/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?$/);
  if (dm) {
    let year = dm[3] || String(new Date().getFullYear());
    if (year.length === 2) year = `20${year}`;
    date = `${year}-${dm[2]}-${dm[1]}`;
  } else if (!date.match(/^(\d{4})-(\d{2})-(\d{2})/)) return null;
  const cleanValue = (rawValue || "0").replace(/r\$/gi, "").replace(/\s/g, "").replace(/\./g, "").replace(",", ".");
  const value = Number(cleanValue);
  if (isNaN(value)) return null;
  return { date, description: (rawDesc || "").trim(), value };
}

// Extrai o texto de um PDF (fatura) usando pdf.js e devolve como texto,
// uma linha por item de texto, aproximando o layout original.
async function extractPdfText(file) {
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let lines = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // agrupa itens por posição vertical (mesma linha visual da fatura)
    const rows = {};
    content.items.forEach((item) => {
      const y = Math.round(item.transform[5]);
      if (!rows[y]) rows[y] = [];
      rows[y].push(item.str);
    });
    const ys = Object.keys(rows).map(Number).sort((a, b) => b - a);
    ys.forEach((y) => lines.push(rows[y].join(" ")));
  }
  return lines.join("\n");
}

// ---------- Campo de valor em Real (formata como R$ 1.000,00 ao digitar) ----------
function CurrencyInput({ value, onChange, style, placeholder }) {
  // value: número (ex.: 1000.5). Exibe formatado; digita só dígitos, últimos 2 = centavos.
  const [digits, setDigits] = useState(value ? String(Math.round(value * 100)) : "");

  useEffect(() => {
    const num = value ? Math.round(value * 100) : 0;
    if (String(num) !== digits) setDigits(value ? String(Math.round(value * 100)) : "");
  }, [value]);

  const display = () => {
    if (!digits) return "";
    const n = Number(digits) / 100;
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  const handleChange = (e) => {
    const raw = e.target.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    setDigits(raw);
    onChange(raw ? Number(raw) / 100 : "");
  };

  return (
    <div className="relative">
      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm opacity-60">R$</span>
      <input
        inputMode="numeric"
        value={display()}
        onChange={handleChange}
        style={{ ...style, paddingLeft: 34 }}
        placeholder={placeholder || "0,00"}
      />
    </div>
  );
}

function useStore() {
  const [state, setState] = useState(null);
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const rules = localStorage.getItem(RULES_KEY);
      setState({
        accounts: raw ? JSON.parse(raw).accounts : [],
        entries: raw ? JSON.parse(raw).entries : [],
        customRules: rules ? JSON.parse(rules) : [],
      });
    } catch (e) {
      setState({ accounts: [], entries: [], customRules: [] });
    }
  }, []);
  const persist = (next) => {
    setState(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ accounts: next.accounts, entries: next.entries }));
      localStorage.setItem(RULES_KEY, JSON.stringify(next.customRules || []));
    } catch (e) { console.error("Falha ao salvar", e); }
  };
  return [state, persist];
}

    </div>;

  const { accounts, entries, customRules } = data;
  const addAccount = (acc) => persist({ ...data, accounts: [...accounts, acc] });
  const removeAccount = (id) => persist({ ...data, accounts: accounts.filter((a) => a.id !== id), entries: entries.filter((e) => e.accountId !== id) });

  const learnRule = (description, type, category) => {
    const norm = normalize(description);
    if (!norm || norm.length < 3) return customRules;
    const already = classify(description, customRules);
    if (already && already.category === category && already.type === type) return customRules;
    const firstWord = norm.split(" ").slice(0, 2).join(" ");
    return [{ kw: firstWord, type, category }, ...customRules.filter((r) => r.kw !== firstWord)];
  };

  const saveEntry = (entry) => {
    const exists = entries.some((e) => e.id === entry.id);
    const next = exists ? entries.map((e) => (e.id === entry.id ? entry : e)) : [...entries, entry];
    const nextRules = learnRule(entry.description, entry.type, entry.category);
    persist({ ...data, entries: next, customRules: nextRules });
  };
  const removeEntry = (id) => persist({ ...data, entries: entries.filter((e) => e.id !== id) });
  const importEntries = (rows) => persist({ ...data, entries: [...entries, ...rows] });

  return (
    <div style={{ background: PAPER, color: INK, minHeight: "100vh" }}>
      <Header accounts={accounts} entries={entries} onNewEntry={() => { setEditingEntry(null); setShowEntryForm(true); }} onImport={() => setShowImport(true)} />

        {[["visao","Visão geral"],["mensal","Mês a mês"],["semestral","Semestral"],["recorrencias","Recorrências"],["relatorio","Relatório PDF"],["lancamentos","Lançamentos"],["contas","Contas"]].map(([key,label]) => (

        ))}

      <main className="px-4 md:px-8 py-6 max-w-5xl mx-auto">
        {tab === "visao" && <Overview accounts={accounts} entries={entries} onImport={() => setShowImport(true)} />}
        {tab === "mensal" && <MonthlyDashboard entries={entries} />}
        {tab === "semestral" && <SemesterDashboard entries={entries} />}
        {tab === "recorrencias" && <RecurringTab entries={entries} />}
        {tab === "relatorio" && <ReportTab accounts={accounts} entries={entries} />}
        {tab === "lancamentos" && <EntriesTab accounts={accounts} entries={entries} onEdit={(e) => { setEditingEntry(e); setShowEntryForm(true); }} onDelete={removeEntry} onImport={() => setShowImport(true)} />}
        {tab === "contas" && <AccountsTab accounts={accounts} entries={entries} onAdd={() => setShowAccountForm(true)} onRemove={removeAccount} />}
      </main>
      {showEntryForm && <EntryModal accounts={accounts} entry={editingEntry} customRules={customRules} onClose={() => setShowEntryForm(false)} onSave={(e) => { saveEntry(e); setShowEntryForm(false); }} />}
      {showAccountForm && <AccountModal onClose={() => setShowAccountForm(false)} onSave={(a) => { addAccount(a); setShowAccountForm(false); }} />}
      {showImport && <ImportModal accounts={accounts} customRules={customRules} onClose={() => setShowImport(false)} onImport={(rows) => { importEntries(rows); setShowImport(false); }} />}
    </div>
  );
}

// ---------- Mini gráficos CSS (sem libs) ----------
function BarRow({ label, value, max, color }) {
  const pct = max > 0 ? Math.max(2, (value / max) * 100) : 0;
  return (
    <div className="flex items-center gap-3 mb-2">
      <div className="w-16 text-xs opacity-60 shrink-0">{label}</div>
      <div className="flex-1 h-3 rounded-full" style={{ background: PAPER_LINE }}>
        <div className="h-3 rounded-full" style={{ width: pct + "%", background: color }} />
      </div>
      <div className="w-24 text-xs font-mono text-right shrink-0">{currency(value)}</div>
    </div>
  );
}

function MonthBars({ data }) {
  const max = Math.max(1, ...data.flatMap((m) => [m.receita, m.despesa]));
  return (
    <div className="flex items-end gap-3 overflow-x-auto pb-2" style={{ minHeight: 160 }}>
      {data.map((m) => (
        <div key={m.ym} className="flex flex-col items-center gap-1 shrink-0" style={{ width: 46 }}>
          <div className="flex items-end gap-1" style={{ height: 120 }}>
            <div title={currency(m.receita)} style={{ width: 10, height: Math.max(3, (m.receita / max) * 120), background: LEDGER_GREEN, borderRadius: 2 }} />
            <div title={currency(m.despesa)} style={{ width: 10, height: Math.max(3, (m.despesa / max) * 120), background: LEDGER_RED, borderRadius: 2 }} />
          </div>
          <div className="text-[10px] opacity-60 text-center">{m.label}</div>
        </div>
      ))}
    </div>
  );
}

function CategoryDonut({ data }) {
  const palette = [LEDGER_RED, "#c96a4f", "#d99a5b", LEDGER_GOLD, "#8a9a5b", "#5b8a7a", "#4f7d8a", "#6f5b8a", "#9a5b7a", "#7a6f5b"];
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let acc = 0;
  const stops = data.map((d, i) => {
    const start = (acc / total) * 360;
    acc += d.value;
    const end = (acc / total) * 360;
    return `${palette[i % palette.length]} ${start}deg ${end}deg`;
  });
  return (
    <div className="flex items-center gap-6">
      <div style={{ width: 140, height: 140, borderRadius: "50%", background: `conic-gradient(${stops.join(",")})`, flexShrink: 0 }} />
      <div className="flex flex-col gap-1">
        {data.slice(0, 7).map((d, i) => (
          <div key={d.name} className="flex items-center gap-2 text-xs">
            <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{ background: palette[i % palette.length] }} />
            <span className="opacity-70">{d.name}</span>
            <span className="font-mono opacity-60">{currency(d.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Overview({ accounts, entries, onImport }) {
  const totals = useMemo(() => { const t = { receita: 0, despesa: 0, investimento: 0 }; entries.forEach((e) => (t[e.type] += e.value)); return t; }, [entries]);
  const byMonth = useMemo(() => {
    const map = {};
    entries.forEach((e) => { const ym = e.date.slice(0,7); if (!map[ym]) map[ym] = { ym, receita:0, despesa:0, investimento:0 }; map[ym][e.type] += e.value; });
    return Object.values(map).sort((a,b) => a.ym.localeCompare(b.ym)).slice(-8).map((m) => ({ ...m, label: monthLabel(m.ym) }));
  }, [entries]);
  const byCategory = useMemo(() => {
    const map = {};
    entries.filter((e) => e.type === "despesa").forEach((e) => (map[e.category] = (map[e.category] || 0) + e.value));
    return Object.entries(map).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value);
  }, [entries]);

  if (entries.length === 0) {
    return <EmptyState title="O livro ainda está em branco" body="Importe as faturas de todos os meses até agora, ou registre seu primeiro lançamento manualmente." action={<button onClick={onImport} className="mt-2 flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium" style={{ background: INK, color: PAPER }}><IFiles size={14}/> Importar faturas</button>} />;
  }

  return (
    <div className="flex flex-col gap-6">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <SummaryCard label="Receitas" value={totals.receita} color={LEDGER_GREEN} I={ITrendUp} />
        <SummaryCard label="Despesas" value={totals.despesa} color={LEDGER_RED} I={ITrendDown} />
        <SummaryCard label="Investimentos" value={totals.investimento} color={LEDGER_GOLD} I={IPiggy} />
      </div>
      <div className="rounded-lg p-5" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
        <div className="font-serif text-lg mb-4">Evolução mensal</div>
        <MonthBars data={byMonth} />
        <div className="flex gap-4 mt-1 text-xs opacity-60">
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: LEDGER_GREEN }} />Receita</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: LEDGER_RED }} />Despesa</span>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div className="rounded-lg p-5" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
          <div className="font-serif text-lg mb-4">Despesas por categoria</div>
          {byCategory.length === 0 ? <div className="text-sm opacity-60">Sem despesas registradas ainda.</div> : <CategoryDonut data={byCategory} />}
        </div>
        <div className="rounded-lg p-5" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
          <div className="font-serif text-lg mb-4">Saldo por conta</div>
          {(() => {
            const rows = accounts.map((a) => ({ name: a.name, saldo: entries.filter((e) => e.accountId === a.id).reduce((s,e) => s + TYPE_META[e.type].sign * e.value, 0) }));
            const max = Math.max(1, ...rows.map((r) => Math.abs(r.saldo)));
            return rows.map((r) => <BarRow key={r.name} label={r.name} value={r.saldo} max={max} color={r.saldo >= 0 ? LEDGER_GREEN : LEDGER_RED} />);
          })()}
        </div>
      </div>
    </div>
  );
}

function SummaryCard({ label, value, color, I }) {
  return (
    <div className="rounded-lg p-5 flex items-center justify-between" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
      <div><div className="text-xs uppercase tracking-wide opacity-60 mb-1">{label}</div><div className="font-mono text-xl" style={{ color }}>{currency(value)}</div></div>

function MonthlyDashboard({ entries }) {
  const months = useMemo(() => {
    const map = {};

    return Object.values(map).sort((a,b) => b.ym.localeCompare(a.ym));

            <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}><tbody>
              <tr><td className="py-0.5 opacity-70">Receitas</td><td className="py-0.5 text-right font-mono" style={{ color: LEDGER_GREEN }}>{currency(s.receita)}</td></tr>
              <tr><td className="py-0.5 opacity-70">Despesas</td><td className="py-0.5 text-right font-mono" style={{ color: LEDGER_RED }}>{currency(s.despesa)}</td></tr>
              <tr><td className="py-0.5 opacity-70">Investimentos</td><td className="py-0.5 text-right font-mono" style={{ color: LEDGER_GOLD }}>{currency(s.investimento)}</td></tr>
              {Object.entries(s.categorias).sort((a,b) => b[1]-a[1]).map(([cat,val]) => <tr key={cat}><td className="py-0.5 pl-4 text-xs opacity-60">{cat}</td><td className="py-0.5 text-right font-mono text-xs opacity-60">{currency(val)}</td></tr>)}
            </tbody></table>
          </div>
        ))}</div>}
        {scope === "todos" && <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}>
          <thead><tr style={{ borderBottom: `1px solid ${PAPER_LINE}` }}>
            <th className="text-left py-1 font-medium">Mês</th>
            <th className="text-right py-1 font-medium" style={{ color: LEDGER_GREEN }}>Receita</th>
            <th className="text-right py-1 font-medium" style={{ color: LEDGER_RED }}>Despesa</th>
            <th className="text-right py-1 font-medium" style={{ color: LEDGER_GOLD }}>Investido</th>
            <th className="text-right py-1 font-medium">Saldo</th>
          </tr></thead>
          <tbody>{months.map((m) => { const saldo = m.receita - m.despesa - m.investimento; return (
            <tr key={m.ym} style={{ borderBottom: `1px solid ${PAPER_LINE}` }}>
              <td className="py-1">{monthLabel(m.ym)}</td>
              <td className="py-1 text-right font-mono">{currency(m.receita)}</td>
              <td className="py-1 text-right font-mono">{currency(m.despesa)}</td>
              <td className="py-1 text-right font-mono">{currency(m.investimento)}</td>
              <td className="py-1 text-right font-mono" style={{ color: saldo>=0?LEDGER_GREEN:LEDGER_RED }}>{currency(saldo)}</td>
            </tr>
          ); })}</tbody>
        </table>}
        {recurring.length > 0 && <div className="mt-6" style={{ borderTop: `1px solid ${PAPER_LINE}`, paddingTop: 12, pageBreakInside: "avoid" }}>
          <div className="font-serif text-base mb-2">Gastos recorrentes identificados</div>
          <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}><tbody>
            {recurring.map((r) => <tr key={r.key}><td className="py-0.5">{r.label}</td><td className="py-0.5 text-xs opacity-60">{r.category}</td><td className="py-0.5 text-right font-mono">~{currency(r.avgValue)}/mês</td></tr>)}
          </tbody></table>
        </div>}
      </div>
    </div>
  );
}

function EntriesTab({ accounts, entries, onEdit, onDelete, onImport }) {
  const [filterType, setFilterType] = useState("todos");
  const [filterAccount, setFilterAccount] = useState("todas");
  const accountName = (id) => accounts.find((a) => a.id === id)?.name || "—";
  const filtered = entries.filter((e) => filterType==="todos"||e.type===filterType).filter((e) => filterAccount==="todas"||e.accountId===filterAccount).sort((a,b) => b.date.localeCompare(a.date));
  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center gap-2 justify-between">
        <div className="flex flex-wrap gap-2">
          <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="text-sm px-3 py-2 rounded-md bg-transparent" style={{ border: `1px solid ${PAPER_LINE}`, color: INK }}>
            <option value="todos">Todos os tipos</option>
            {Object.entries(TYPE_META).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
          <select value={filterAccount} onChange={(e) => setFilterAccount(e.target.value)} className="text-sm px-3 py-2 rounded-md bg-transparent" style={{ border: `1px solid ${PAPER_LINE}`, color: INK }}>
            <option value="todas">Todas as contas</option>
            {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </div>
        <button onClick={onImport} className="flex items-center gap-2 px-3 py-2 rounded-md text-sm" style={{ border: `1px solid ${PAPER_LINE}`, color: INK }}><IFiles size={14}/> Importar faturas</button>
      </div>
      {filtered.length === 0 ? <EmptyState title="Nada por aqui" body="Nenhum lançamento corresponde a este filtro." /> : (
        <div className="rounded-lg overflow-hidden" style={{ border: `1px solid ${PAPER_LINE}`, background: CARD }}>
          {filtered.map((e,i) => { const meta = TYPE_META[e.type]; const I = meta.Icon; return (
            <div key={e.id} className="flex items-center gap-3 px-4 py-3" style={{ borderTop: i===0?"none":`1px solid ${PAPER_LINE}` }}>
              <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: `${meta.color}1a` }}><I size={15} color={meta.color} /></div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate">{e.description || meta.label}</div>
                <div className="text-xs opacity-60">{new Date(e.date+"T00:00:00").toLocaleDateString("pt-BR")} · {e.category} · {accountName(e.accountId)}{e.auto && <span className="ml-1.5 inline-flex items-center gap-0.5" style={{ color: LEDGER_GOLD }}><ISparkle size={10}/> auto</span>}</div>
              </div>
              <div className="font-mono text-sm shrink-0" style={{ color: meta.color }}>{meta.sign>0?"+":"−"} {currency(e.value)}</div>
              <div className="flex gap-1 shrink-0">
                <button onClick={() => onEdit(e)} className="w-7 h-7 rounded-md flex items-center justify-center opacity-50 hover:opacity-100" style={{ border: `1px solid ${PAPER_LINE}` }}><IPencil size={13}/></button>
                <button onClick={() => onDelete(e.id)} className="w-7 h-7 rounded-md flex items-center justify-center opacity-50 hover:opacity-100" style={{ border: `1px solid ${PAPER_LINE}` }}><ITrash size={13}/></button>
              </div>
            </div>
          ); })}
        </div>
      )}
    </div>
  );
}

function AccountsTab({ accounts, entries, onAdd, onRemove }) {
  return (
    <div className="flex flex-col gap-4">
      <div className="flex justify-between items-center">
        <div className="font-serif text-lg">Suas contas</div>
        <button onClick={onAdd} className="flex items-center gap-2 px-3 py-2 rounded-md text-sm" style={{ background: INK, color: PAPER }}><IPlus size={14}/> Nova conta</button>
      </div>
      {accounts.length === 0 ? <EmptyState title="Nenhuma conta cadastrada" body="Cadastre suas contas correntes, cartões e investimentos para organizar os lançamentos." /> : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {accounts.map((a) => { const saldo = entries.filter((e) => e.accountId===a.id).reduce((s,e) => s + TYPE_META[e.type].sign*e.value, 0); return (
            <div key={a.id} className="rounded-lg p-4 flex items-center justify-between" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: `${INK}0d` }}><ILandmark size={16}/></div>
                <div><div className="text-sm font-medium">{a.name}</div><div className="text-xs opacity-60">{a.type}</div></div>
              </div>
              <div className="flex items-center gap-3">
                <div className="font-mono text-sm" style={{ color: saldo>=0?LEDGER_GREEN:LEDGER_RED }}>{currency(saldo)}</div>
                <button onClick={() => onRemove(a.id)} className="w-7 h-7 rounded-md flex items-center justify-center opacity-50 hover:opacity-100" style={{ border: `1px solid ${PAPER_LINE}` }}><ITrash size={13}/></button>
              </div>
            </div>
          ); })}
        </div>
      )}
    </div>
  );
}

function ModalShell({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-30 flex items-end md:items-center justify-center" style={{ background: "#1f2e2866" }}>
      <div className={`w-full ${wide ? "md:max-w-xl" : "md:max-w-sm"} rounded-t-xl md:rounded-xl p-5 max-h-[90vh] overflow-y-auto`} style={{ background: PAPER, border: `1px solid ${PAPER_LINE}` }}>
        <div className="flex items-center justify-between mb-4"><div className="font-serif text-lg">{title}</div><button onClick={onClose} className="opacity-50 hover:opacity-100"><IX size={18}/></button></div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <label className="flex flex-col gap-1 text-sm"><span className="text-xs uppercase tracking-wide opacity-60">{label}</span>{children}</label>;
}

const inputStyle = { border: `1px solid ${PAPER_LINE}`, background: CARD, color: INK, borderRadius: 6, padding: "8px 10px", fontSize: 14, width: "100%" };

function EntryModal({ accounts, entry, customRules, onClose, onSave }) {
  const [type, setType] = useState(entry?.type || "despesa");
  const [value, setValue] = useState(entry?.value ?? "");
  const [date, setDate] = useState(entry?.date || new Date().toISOString().slice(0,10));
  const [accountId, setAccountId] = useState(entry?.accountId || accounts[0]?.id || "");
  const [category, setCategory] = useState(entry?.category || DEFAULT_CATEGORIES[type][0]);
  const [description, setDescription] = useState(entry?.description || "");
  const [categoryTouched, setCategoryTouched] = useState(!!entry);

  useEffect(() => { if (!entry && !categoryTouched) setCategory(DEFAULT_CATEGORIES[type][0]); }, [type]);
  useEffect(() => {
    if (entry || categoryTouched) return;
    const guess = classify(description, customRules);
    if (guess) { setType(guess.type); setCategory(guess.category); }
  }, [description]);

  const canSave = value !== "" && !isNaN(Number(value)) && accountId;
  return (
    <ModalShell title={entry ? "Editar lançamento" : "Novo lançamento"} onClose={onClose}>
      <div className="flex flex-col gap-3">
        <Field label="Descrição"><input value={description} onChange={(e) => setDescription(e.target.value)} style={inputStyle} placeholder="Ex.: Ifood, honorários do processo X…" autoFocus /></Field>
        {!entry && classify(description, customRules) && !categoryTouched && <div className="text-xs flex items-center gap-1.5" style={{ color: LEDGER_GOLD }}><ISparkle size={12}/> Classificado automaticamente — ajuste se quiser.</div>}
        <div className="flex gap-2">
          {Object.entries(TYPE_META).map(([k,v]) => (
            <button key={k} onClick={() => { setType(k); setCategoryTouched(true); }} className="flex-1 py-2 rounded-md text-xs font-medium" style={{ border: `1px solid ${type===k?v.color:PAPER_LINE}`, color: type===k?v.color:INK, background: type===k?`${v.color}12`:"transparent" }}>{v.label}</button>
          ))}
        </div>
        <Field label="Valor (R$)"><CurrencyInput value={value === "" ? "" : Number(value)} onChange={(v) => setValue(v === "" ? "" : v)} style={inputStyle} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Data"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} /></Field>
          <Field label="Categoria"><select value={category} onChange={(e) => { setCategory(e.target.value); setCategoryTouched(true); }} style={inputStyle}>{DEFAULT_CATEGORIES[type].map((c) => <option key={c}>{c}</option>)}</select></Field>
        </div>
        <Field label="Conta"><select value={accountId} onChange={(e) => setAccountId(e.target.value)} style={inputStyle}>{accounts.length===0 && <option value="">Cadastre uma conta primeiro</option>}{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select></Field>
        <button disabled={!canSave} onClick={() => onSave({ id: entry?.id || uid(), type, value: Number(value), date, accountId, category, description })} className="mt-2 py-2.5 rounded-md text-sm font-medium disabled:opacity-40" style={{ background: INK, color: PAPER }}>Salvar lançamento</button>
      </div>
    </ModalShell>
  );
}

function AccountModal({ onClose, onSave }) {
  const [name, setName] = useState("");
  const [type, setType] = useState(ACCOUNT_TYPES[0]);
  return (
    <ModalShell title="Nova conta" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <Field label="Nome"><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} placeholder="Ex.: Nubank, Itaú, XP…" /></Field>
        <Field label="Tipo"><select value={type} onChange={(e) => setType(e.target.value)} style={inputStyle}>{ACCOUNT_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <button disabled={!name.trim()} onClick={() => onSave({ id: uid(), name: name.trim(), type })} className="mt-2 py-2.5 rounded-md text-sm font-medium disabled:opacity-40" style={{ background: INK, color: PAPER }}>Adicionar conta</button>
      </div>
    </ModalShell>
  );
}

function ImportModal({ accounts, customRules, onClose, onImport }) {
  const [accountId, setAccountId] = useState(accounts[0]?.id || "");
  const [pasted, setPasted] = useState("");
  const [fileRows, setFileRows] = useState([]);
  const fileRef = useRef(null);

  const handleFiles = (files) => {
    Array.from(files).forEach(async (file) => {
      const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
      if (isPdf) {
        try {
          const text = await extractPdfText(file);
          const rows = parseStatementText(text);
          setFileRows((prev) => [...prev, { fileName: file.name, rows }]);
        } catch (e) {
          setFileRows((prev) => [...prev, { fileName: file.name + " (falhou ao ler o PDF)", rows: [] }]);
        }
        return;
      }
      const reader = new FileReader();
      reader.onload = () => { const rows = parseStatementText(String(reader.result || "")); setFileRows((prev) => [...prev, { fileName: file.name, rows }]); };
      reader.readAsText(file, "utf-8");
    });
  };
  const pastedRows = useMemo(() => pasted.trim() ? parseStatementText(pasted) : [], [pasted]);
  const allRaw = useMemo(() => [...fileRows.flatMap((f) => f.rows), ...pastedRows], [fileRows, pastedRows]);
  const classified = useMemo(() => allRaw.map((r) => { const guess = classify(r.description, customRules) || { type: "despesa", category: "Outros" }; return { id: uid(), accountId, date: r.date, description: r.description, value: Math.abs(r.value), type: guess.type, category: guess.category, auto: true }; }), [allRaw, accountId, customRules]);
  const monthsCovered = useMemo(() => [...new Set(classified.map((e) => e.date.slice(0,7)))].sort(), [classified]);

  return (
    <ModalShell title="Importar faturas" onClose={onClose} wide>
      <div className="flex flex-col gap-3">
        <div className="text-xs opacity-60 flex items-start gap-1.5"><IInfo size={13} className="shrink-0 mt-0.5"/> Envie de uma vez as faturas em PDF (ou .csv) de todos os meses — o app lê o texto do PDF automaticamente, junta tudo e classifica cada gasto sozinho. Também dá para colar o texto de uma fatura copiada do app do banco.</div>
        <Field label="Conta / cartão de destino"><select value={accountId} onChange={(e) => setAccountId(e.target.value)} style={inputStyle}>{accounts.length===0 && <option value="">Cadastre uma conta primeiro</option>}{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select></Field>
        <div onClick={() => fileRef.current?.click()} className="rounded-md p-6 text-center text-sm cursor-pointer" style={{ border: `1px dashed ${PAPER_LINE}`, background: CARD }}>
          <div className="flex justify-center mb-2 opacity-60"><IFiles size={18}/></div>
          Clique para escolher uma ou várias faturas (.pdf ou .csv de cada mês)
          <input ref={fileRef} type="file" accept=".csv,text/csv,.txt,.pdf,application/pdf" multiple className="hidden" onChange={(e) => e.target.files && handleFiles(e.target.files)} />
        </div>
        {fileRows.length > 0 && <div className="flex flex-wrap gap-2">{fileRows.map((f,i) => (
          <div key={i} className="text-xs px-2 py-1 rounded-full flex items-center gap-1.5" style={{ background: `${LEDGER_GREEN}12`, color: LEDGER_GREEN }}>
            {f.fileName} · {f.rows.length} linhas
            <button onClick={() => setFileRows((prev) => prev.filter((_,idx) => idx!==i))} className="opacity-60 hover:opacity-100"><IX size={11}/></button>
          </div>
        ))}</div>}
        <Field label="Ou cole aqui o texto da fatura (opcional)"><textarea value={pasted} onChange={(e) => setPasted(e.target.value)} rows={4} style={{ ...inputStyle, fontFamily: "monospace", fontSize: 12 }} placeholder={"12/03  IFOOD *IFOOD           45,90\n13/03  UBER *TRIP            18,50"} /></Field>
        {classified.length > 0 ? (
          <div className="rounded-md p-3 text-xs" style={{ background: CARD, border: `1px solid ${PAPER_LINE}` }}>
            <div className="font-medium mb-1">{classified.length} lançamentos prontos · {monthsCovered.map(monthLabel).join(", ")}</div>
            <div className="opacity-60">Categorias atribuídas automaticamente — revise na aba Lançamentos depois de importar.</div>
          </div>
        ) : (allRaw.length===0 && (fileRows.length>0 || pasted)) && <div className="text-xs" style={{ color: LEDGER_RED }}>Não consegui reconhecer linhas de lançamento neste conteúdo. Confira o formato (data, descrição, valor).</div>}
        <button disabled={classified.length===0 || !accountId} onClick={() => onImport(classified)} className="mt-2 py-2.5 rounded-md text-sm font-medium disabled:opacity-40" style={{ background: INK, color: PAPER }}>Importar {classified.length>0 ? `(${classified.length})` : ""}</button>
      </div>
    </ModalShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  var code = document.getElementById("app-source").textContent;
  var output = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
  var script = document.createElement("script");
  script.text = output;
  document.body.appendChild(script);
</script>
</body>
</html>
