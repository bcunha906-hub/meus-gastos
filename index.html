<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Meus Gastos</title>
<style>
  :root{
    --bg:#0b0e14; --surface:#141924; --surface2:#1b2231; --border:#242c3d;
    --text:#e7ebf3; --muted:#8792a6; --green:#37d6a0; --red:#ff6961; --gold:#f2b84b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:110px;}
  .wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;}
  .header{display:flex;align-items:center;gap:8px;padding:22px 20px 4px;}
  .logo{width:30px;height:30px;border-radius:50%;background:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .brand{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  .monthnav{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;}
  .monthnav button{background:none;border:none;color:var(--muted);font-size:20px;
    width:36px;height:36px;border-radius:50%;}
  .monthnav button:active{background:var(--surface2);}
  .monthnav .label{font-size:17px;font-weight:700;text-transform:capitalize;}
  .card{margin:14px 20px;padding:20px;border-radius:22px;background:var(--surface);
    border:1px solid var(--border);}
  .card .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;}
  .saldo{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;}
  .row2{display:flex;gap:12px;margin-top:16px;}
  .pill{flex:1;background:var(--surface2);border-radius:16px;padding:10px 12px;}
  .pill .lbl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;margin-bottom:2px;}
  .pill .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .income{color:var(--green);} .expense{color:var(--red);}
  .section{margin:20px 20px 0;}
  .eyebrow-lg{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;}
  .catrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .caticon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;}
  .catbar-wrap{flex:1;min-width:0;}
  .catbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .catbar-top .name{color:#c7cedb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .catbar-top .amt{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px;flex-shrink:0;}
  .catbar-track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;}
  .catbar-fill{height:100%;border-radius:3px;}
  .daylabel{font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:capitalize;}
  .txlist{border-radius:18px;background:var(--surface);border:1px solid var(--border);overflow:hidden;margin-bottom:16px;}
  .tx{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--border);}
  .tx:last-child{border-bottom:none;}
  .tx .icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .tx .info{flex:1;min-width:0;}
  .tx .title{font-size:14px;color:#dde3ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx .note{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .tx .del{background:none;border:none;color:#6b7385;padding:6px;flex-shrink:0;font-size:15px;}
  .empty{border:1.5px dashed var(--border);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted);}
  .empty .big{font-size:26px;margin-bottom:8px;}
  .empty p{margin:2px 0;font-size:13px;}
  .fabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
    background:linear-gradient(to top, var(--bg) 55%, transparent);padding:26px 0 20px;pointer-events:none;}
  .fabs-inner{width:100%;max-width:480px;padding:0 20px;display:flex;justify-content:flex-end;gap:10px;}
  .fab-income{pointer-events:auto;height:48px;padding:0 16px;border-radius:24px;background:var(--surface2);
    border:1px solid var(--border);color:var(--green);font-weight:600;font-size:14px;
    display:flex;align-items:center;gap:6px;}
  .fab-add{pointer-events:auto;height:48px;width:48px;border-radius:50%;background:var(--green);
    border:none;color:#0b0e14;font-size:26px;font-weight:700;box-shadow:0 6px 18px rgba(55,214,160,.35);}
  .fab-income:active,.fab-add:active{transform:scale(.95);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
  .modal-overlay.open{display:block;}
  .modal{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;
    background:var(--surface);border-top:1px solid var(--border);border-radius:24px 24px 0 0;
    padding:14px 20px 32px;max-height:88vh;overflow-y:auto;display:none;}
  .modal.open{display:block;}
  .grip{width:38px;height:4px;border-radius:2px;background:#333c4d;margin:0 auto 16px;}
  .modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .toggle{display:flex;background:var(--surface2);border-radius:20px;padding:4px;}
  .toggle button{border:none;background:none;padding:8px 16px;border-radius:16px;font-size:14px;font-weight:600;color:var(--muted);}
  .toggle button.active.exp{background:var(--red);color:#0b0e14;}
  .toggle button.active.inc{background:var(--green);color:#0b0e14;}
  .closebtn{background:none;border:none;color:var(--muted);font-size:20px;padding:6px;}
  .amountwrap{display:flex;align-items:center;justify-content:center;gap:4px;padding:20px 0;}
  .amountwrap .cur{font-size:22px;color:var(--muted);}
  .amountwrap input{background:none;border:none;outline:none;color:var(--text);font-size:38px;
    font-weight:800;width:180px;text-align:center;font-variant-numeric:tabular-nums;}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .catbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;
    border-radius:16px;border:1px solid transparent;background:rgba(255,255,255,.03);}
  .catbtn.active{background:var(--surface2);border-color:#3a4358;}
  .catbtn .ci{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .catbtn span{font-size:10px;color:#a7afc0;text-align:center;line-height:1.2;}
  .fieldsrow{display:flex;gap:10px;margin-bottom:16px;}
  .fieldsrow input{background:var(--surface2);border:1px solid var(--border);border-radius:14px;
    padding:12px;font-size:14px;color:var(--text);outline:none;}
  .fieldsrow input[type=date]{flex:1;color-scheme:dark;}
  .fieldsrow input[type=text]{flex:1.5;}
  .savebtn{width:100%;height:50px;border-radius:16px;border:none;background:var(--green);
    color:#0b0e14;font-size:16px;font-weight:700;}
  .savebtn:disabled{opacity:.3;}
  .savebtn:active:not(:disabled){transform:scale(.98);}
  .saveerr{margin:6px 20px 0;font-size:12px;color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">💰</div>
    <div class="brand">MEUS GASTOS</div>
  </div>

  <div class="monthnav">
    <button id="prevMonth">‹</button>
    <span class="label" id="monthLabel">—</span>
    <button id="nextMonth">›</button>
  </div>

  <div class="card">
    <div class="eyebrow">Saldo do mês</div>
    <div class="saldo" id="saldoVal">R$ 0,00</div>
    <div class="row2">
      <div class="pill">
        <div class="lbl income">↗ Receitas</div>
        <div class="val" id="incomeVal">R$ 0,00</div>
      </div>
      <div class="pill">
        <div class="lbl expense">↘ Despesas</div>
        <div class="val" id="expenseVal">R$ 0,00</div>
      </div>
    </div>
  </div>

  <div class="section" id="catSection" style="display:none;">
    <div class="eyebrow-lg">Por categoria</div>
    <div id="catList"></div>
  </div>

  <div class="section">
    <div class="eyebrow-lg">Lançamentos</div>
    <div id="txContainer"></div>
  </div>

  <div class="saveerr" id="saveErr" style="display:none;">Não foi possível salvar agora. Tente novamente.</div>
</div>

<div class="fabs">
  <div class="fabs-inner">
    <button class="fab-income" id="openIncome">↗ Receita</button>
    <button class="fab-add" id="openExpense">+</button>
  </div>
</div>

<div class="modal-overlay" id="overlay"></div>
<div class="modal" id="modal">
  <div class="grip"></div>
  <div class="modal-top">
    <div class="toggle">
      <button id="typeExpense" class="exp">Despesa</button>
      <button id="typeIncome" class="inc">Receita</button>
    </div>
    <button class="closebtn" id="closeModal">✕</button>
  </div>
  <div class="amountwrap">
    <span class="cur">R$</span>
    <input id="amountInput" type="text" inputmode="decimal" placeholder="0,00" />
  </div>
  <div class="catgrid" id="catGrid"></div>
  <div class="fieldsrow">
    <input id="dateInput" type="date" />
    <input id="noteInput" type="text" placeholder="Nota (opcional)" />
  </div>
  <button class="savebtn" id="saveBtn" disabled>Salvar</button>
</div>

<script>
const CATEGORIES = [
  {id:"alimentacao", label:"Alimentação", icon:"🍽️", color:"#F2B84B"},
  {id:"transporte", label:"Transporte", icon:"🚗", color:"#5AA9E6"},
  {id:"moradia", label:"Moradia", icon:"🏠", color:"#37D6A0"},
  {id:"saude", label:"Saúde", icon:"❤️", color:"#FF6961"},
  {id:"lazer", label:"Lazer", icon:"🎮", color:"#C792EA"},
  {id:"compras", label:"Compras", icon:"🛍️", color:"#F2994A"},
  {id:"educacao", label:"Educação", icon:"🎓", color:"#56CCF2"},
  {id:"outros", label:"Outros", icon:"⋯", color:"#9AA5B1"},
];
const catById = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];
const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const weekdayShort = ["dom","seg","ter","qua","qui","sex","sáb"];

function fmt(n){
  return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
function todayISO(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function formatDayLabel(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date();
  const isToday = date.getFullYear()===today.getFullYear() && date.getMonth()===today.getMonth() && date.getDate()===today.getDate();
  if (isToday) return "Hoje";
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if (date.getFullYear()===yest.getFullYear() && date.getMonth()===yest.getMonth() && date.getDate()===yest.getDate()) return "Ontem";
  return weekdayShort[date.getDay()] + ", " + d + " de " + monthNames[m-1].slice(0,3).toLowerCase();
}

let transactions = [];
let cursor = (() => { const n = new Date(); return {y:n.getFullYear(), m:n.getMonth()}; })();
let modalType = "expense";
let modalCategory = "alimentacao";

let storageAvailable = true;

function loadData(){
  try{
    const raw = localStorage.getItem("gastos_transactions");
    if (raw) transactions = JSON.parse(raw);
  }catch(e){
    storageAvailable = false;
  }
  render();
}

function saveData(){
  try{
    localStorage.setItem("gastos_transactions", JSON.stringify(transactions));
    document.getElementById("saveErr").style.display = "none";
  }catch(e){
    storageAvailable = false;
    document.getElementById("saveErr").style.display = "block";
  }
}

function monthTx(){
  return transactions.filter(t => {
    const [y,m] = t.date.split("-").map(Number);
    return y === cursor.y && (m-1) === cursor.m;
  });
}

function render(){
  document.getElementById("monthLabel").textContent = monthNames[cursor.m] + " " + cursor.y;
  const tx = monthTx();
  const income = tx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = tx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const saldo = income - expense;

  const saldoEl = document.getElementById("saldoVal");
  saldoEl.textContent = fmt(saldo);
  saldoEl.style.color = saldo >= 0 ? "var(--green)" : "var(--red)";
  document.getElementById("incomeVal").textContent = fmt(income);
  document.getElementById("expenseVal").textContent = fmt(expense);

  const map = {};
  tx.filter(t=>t.type==="expense").forEach(t => { map[t.category] = (map[t.category]||0) + t.amount; });
  const byCat = Object.entries(map).map(([id,total]) => ({...catById(id), id, total})).sort((a,b)=>b.total-a.total);
  const catSection = document.getElementById("catSection");
  const catList = document.getElementById("catList");
  if (byCat.length === 0){
    catSection.style.display = "none";
  } else {
    catSection.style.display = "block";
    const max = byCat[0].total;
    catList.innerHTML = byCat.slice(0,5).map(c => `
      <div class="catrow">
        <div class="caticon" style="background:${c.color}26;">${c.icon}</div>
        <div class="catbar-wrap">
          <div class="catbar-top"><span class="name">${c.label}</span><span class="amt">${fmt(c.total)}</span></div>
          <div class="catbar-track"><div class="catbar-fill" style="width:${(c.total/max)*100}%;background:${c.color};"></div></div>
        </div>
      </div>
    `).join("");
  }

  const grouped = {};
  tx.forEach(t => { (grouped[t.date] = grouped[t.date] || []).push(t); });
  const days = Object.keys(grouped).sort((a,b)=> a<b?1:-1);
  const container = document.getElementById("txContainer");
  if (days.length === 0){
    container.innerHTML = `<div class="empty"><div class="big">🏦</div><p>Nenhum lançamento neste mês.</p><p>Toque em + para adicionar o primeiro.</p></div>`;
  } else {
    container.innerHTML = days.map(day => {
      const items = grouped[day].slice().sort((a,b)=> (b.id||"").localeCompare(a.id||""));
      const rows = items.map(t => {
        const isIncome = t.type === "income";
        const c = catById(t.category);
        const icon = isIncome ? "↗" : c.icon;
        const color = isIncome ? "#37D6A0" : c.color;
        const title = isIncome ? "Receita" : c.label;
        return `
          <div class="tx">
            <div class="icon" style="background:${color}26;color:${color};">${icon}</div>
            <div class="info">
              <div class="title">${title}</div>
              ${t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : ""}
            </div>
            <div class="amt" style="color:${isIncome ? "var(--green)" : "#dde3ee"};">${isIncome?"+":"-"}${fmt(t.amount)}</div>
            <button class="del" data-id="${t.id}">🗑</button>
          </div>
        `;
      }).join("");
      return `<div class="daylabel">${formatDayLabel(day)}</div><div class="txlist">${rows}</div>`;
    }).join("");
    container.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => {
        transactions = transactions.filter(t => t.id !== btn.dataset.id);
        saveData();
        render();
      });
    });
  }
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function shiftMonth(delta){
  let m = cursor.m + delta, y = cursor.y;
  if (m < 0){ m = 11; y -= 1; }
  if (m > 11){ m = 0; y += 1; }
  cursor = {y,m};
  render();
}

document.getElementById("prevMonth").addEventListener("click", () => shiftMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => shiftMonth(1));

const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const amountInput = document.getElementById("amountInput");
const dateInput = document.getElementById("dateInput");
const noteInput = document.getElementById("noteInput");
const saveBtn = document.getElementById("saveBtn");
const catGrid = document.getElementById("catGrid");

function renderCatGrid(){
  if (modalType !== "expense"){ catGrid.style.display = "none"; return; }
  catGrid.style.display = "grid";
  catGrid.innerHTML = CATEGORIES.map(c => `
    <button class="catbtn ${c.id===modalCategory?"active":""}" data-id="${c.id}">
      <div class="ci" style="background:${c.color}${c.id===modalCategory?"40":"20"};">${c.icon}</div>
      <span>${c.label}</span>
    </button>
  `).join("");
  catGrid.querySelectorAll(".catbtn").forEach(btn => {
    btn.addEventListener("click", () => { modalCategory = btn.dataset.id; renderCatGrid(); });
  });
}

function openModal(type){
  modalType = type;
  modalCategory = "alimentacao";
  amountInput.value = "";
  noteInput.value = "";
  dateInput.value = todayISO();
  document.getElementById("typeExpense").classList.toggle("active", type==="expense");
  document.getElementById("typeIncome").classList.toggle("active", type==="income");
  renderCatGrid();
  overlay.classList.add("open");
  modal.classList.add("open");
  saveBtn.disabled = true;
  setTimeout(() => amountInput.focus(), 80);
}
function closeModal(){
  overlay.classList.remove("open");
  modal.classList.remove("open");
}

document.getElementById("openExpense").addEventListener("click", () => openModal("expense"));
document.getElementById("openIncome").addEventListener("click", () => openModal("income"));
document.getElementById("closeModal").addEventListener("click", closeModal);
overlay.addEventListener("click", closeModal);
document.getElementById("typeExpense").addEventListener("click", () => { modalType="expense"; document.getElementById("typeExpense").classList.add("active"); document.getElementById("typeIncome").classList.remove("active"); renderCatGrid(); });
document.getElementById("typeIncome").addEventListener("click", () => { modalType="income"; document.getElementById("typeIncome").classList.add("active"); document.getElementById("typeExpense").classList.remove("active"); renderCatGrid(); });

amountInput.addEventListener("input", () => {
  amountInput.value = amountInput.value.replace(/[^0-9.,]/g, "");
  const val = parseFloat(amountInput.value.replace(",", "."));
  saveBtn.disabled = !(val > 0);
});

saveBtn.addEventListener("click", () => {
  const val = parseFloat(amountInput.value.replace(",", "."));
  if (!(val > 0)) return;
  transactions.unshift({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    type: modalType,
    amount: val,
    category: modalType === "expense" ? modalCategory : "receita",
    note: noteInput.value.trim(),
    date: dateInput.value || todayISO(),
  });
  saveData();
  closeModal();
  render();
});

render();
loadData();
</script>
</body>
</html>
